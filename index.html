<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hearts2Hearts Calendar (Secure)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg: #f4faff;
    --bg-alt: #e8f3fd;
    --card: #ffffff;
    --card-hi: #eaf4fe;
    --line: #cfe6f8;
    --text: #0f2c47;
    --text-dim: #4c6f8c;
    --text-faint: #8aa8c2;
    --accent-a: #2f8fef;
    --accent-b: #0a5fc9;
    --gold: #f5a623;
    --blue: #2f8fef;
    --red: #e05a5a;
    --green: #29a86c;
    --radius: 16px;
    --radius-sm: 10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background: radial-gradient(120% 100% at 15% -10%, #d9edfc 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    padding-bottom: 60px;
  }
  .display{ font-family:'Baloo 2', sans-serif; }
  a{color:inherit;}

  header{
    position: sticky; top:0; z-index:50;
    background: rgba(255,255,255,0.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .header-inner{
    max-width: 1040px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 20px;
    gap: 16px;
  }
  .logo{
    display:flex; align-items:center; gap:10px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:1.25rem;
    letter-spacing: 0.01em;
  }
  .logo svg{ flex-shrink:0; }
  .logo .sub{ font-family:'Inter',sans-serif; font-weight:500; font-size:0.68rem; color:var(--text-faint); display:block; margin-top:-2px;}
  .header-actions{ display:flex; align-items:center; gap:10px; }

  .controls{
    max-width: 1040px; margin: 26px auto 0; padding: 0 20px;
    display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
  }
  .search-wrap{
    position:relative; flex: 1 1 240px; max-width: 340px;
  }
  .search-wrap input{
    width:100%; background: var(--card); border:1px solid var(--line);
    color: var(--text); border-radius: 999px; padding: 10px 16px 10px 38px;
    font-size: 0.88rem; font-family:'Inter';
  }
  .search-wrap input::placeholder{ color: var(--text-faint); }
  .search-wrap svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:0.55;}

  .view-toggle{
    display:flex; background: var(--card); border:1px solid var(--line);
    border-radius: 999px; padding: 3px; gap:2px;
  }
  .view-toggle button{
    border:none; background:transparent; color: var(--text-dim);
    font-family:'Inter'; font-weight:600; font-size:0.82rem;
    padding: 8px 16px; border-radius: 999px; cursor:pointer;
    transition: background .18s ease, color .18s ease;
  }
  .view-toggle button.active{
    background: linear-gradient(100deg, var(--accent-a), var(--accent-b));
    color: #ffffff;
  }

  .filter-row{
    max-width: 1040px; margin: 16px auto 0; padding: 0 20px;
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .chip{
    border:1px solid var(--line); background: var(--card);
    color: var(--text-dim); font-family:'Inter'; font-weight:600; font-size:0.8rem;
    padding: 7px 14px; border-radius: 999px; cursor:pointer;
    display:flex; align-items:center; gap:7px;
    transition: border-color .15s ease, color .15s ease;
  }
  .chip .dot{ width:8px; height:8px; border-radius:50%; }
  .chip.active{ border-color: var(--dotcolor, var(--accent-a)); color: var(--text); }
  .chip:hover{ color: var(--text); }

  main{ max-width: 1040px; margin: 30px auto 0; padding: 0 20px; display:grid; grid-template-columns: 1fr 300px; gap: 22px;}
  @media (max-width: 800px){ main{ grid-template-columns: 1fr; } }

  .panel{ background: var(--card); border:1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: 0 4px 24px rgba(15,44,71,0.06); }

  .month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .month-nav h2{ font-family:'Baloo 2'; font-size:1.3rem; font-weight:700; }
  .month-nav .btns{ display:flex; gap:6px; }
  .month-nav button{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--line);
    background: var(--bg-alt); color: var(--text); cursor:pointer; font-size:1rem;
    display:flex; align-items:center; justify-content:center;
  }
  .month-nav button:hover{ background: var(--card-hi); }

  .grid-week{ display:grid; grid-template-columns: repeat(7,1fr); gap:6px; margin-bottom:6px;}
  .grid-week span{ text-align:center; font-size:0.72rem; color: var(--text-faint); font-weight:600; }
  .grid-days{ display:grid; grid-template-columns: repeat(7,1fr); gap:6px; }
  .day-cell{
    aspect-ratio: 1/0.92; border-radius: 10px; padding: 6px;
    background: var(--bg-alt); border:1px solid transparent;
    display:flex; flex-direction:column; gap:4px; cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
    position:relative;
  }
  .day-cell.other{ opacity:0.28; }
  .day-cell:hover{ border-color: var(--accent-b); }
  .day-cell.today{ border-color: var(--accent-a); background: rgba(47,143,239,0.1); }
  .day-cell.selected{ background: linear-gradient(160deg, rgba(47,143,239,0.2), rgba(88,208,255,0.18)); border-color: var(--accent-a); }
  .day-num{ font-size:0.78rem; font-weight:600; }
  .day-dots{ display:flex; gap:3px; flex-wrap:wrap; margin-top:auto; }
  .day-dots i{ width:6px; height:6px; border-radius:50%; display:block; }

  .day-detail{ margin-top:18px; border-top:1px solid var(--line); padding-top:14px; }
  .day-detail h3{ font-family:'Baloo 2'; font-size:1rem; margin-bottom:10px; color: var(--text-dim); font-weight:600; }

  .event{
    display:flex; gap:12px; padding: 12px; border-radius: var(--radius-sm);
    background: var(--bg-alt); margin-bottom:8px; border:1px solid var(--line);
    position:relative;
  }
  .event .bar{ width:4px; border-radius:2px; flex-shrink:0; }
  .event .body{ flex:1; }
  .event .time{ font-size:0.72rem; color: var(--text-faint); font-weight:600; }
  .event .title{ font-weight:600; font-size:0.92rem; margin-top:2px; }
  .event .meta{ font-size:0.76rem; color: var(--text-dim); margin-top:3px; }
  .event .tag{
    display:inline-block; font-size:0.66rem; font-weight:700; letter-spacing:.02em;
    padding: 2px 8px; border-radius: 999px; margin-top:6px;
  }
  .empty-msg{ color: var(--text-faint); font-size:0.85rem; padding: 10px 2px; }

  .list-group{ margin-bottom: 22px; }
  .list-group h3{ font-family:'Baloo 2'; font-size:1.05rem; color: var(--accent-a); margin-bottom:10px; }

  .side-panel h3{ font-family:'Baloo 2'; font-size:1rem; margin-bottom:12px; }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:0.82rem; color: var(--text-dim); margin-bottom:8px; }
  .legend-item i{ width:9px; height:9px; border-radius:50%; }

  footer{
    max-width: 1040px; margin: 46px auto 0; padding: 22px 20px 0;
    border-top: 1px solid var(--line);
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:14px;
    color: var(--text-faint); font-size:0.8rem;
  }
  footer a{ color: var(--text-dim); text-decoration:none; margin-right:14px; }
  footer a:hover{ color: var(--accent-a); }

  .admin-btn{
    background: var(--card); color: var(--text-dim);
    border:1px solid var(--line); border-radius: 999px;
    padding: 7px 14px; font-size:0.8rem; font-family:'Inter'; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .admin-btn.on{ background: linear-gradient(100deg, var(--accent-a), var(--accent-b)); color:#fff; border-color: transparent; }
  .admin-btn .pip{ width:7px; height:7px; border-radius:50%; background: var(--text-faint); }
  .admin-btn.on .pip{ background:#fff; }

  .add-btn{
    background: linear-gradient(100deg, var(--accent-a), var(--accent-b)); color:#fff;
    border:none; border-radius: 999px; padding: 9px 16px; font-family:'Inter'; font-weight:700;
    font-size:0.85rem; cursor:pointer; display:flex; align-items:center; gap:6px;
  }

  .event-actions{ display:flex; gap:6px; margin-left:auto; flex-shrink:0; }
  .event-actions button{
    width:26px; height:26px; border-radius:8px; border:1px solid var(--line);
    background: var(--card); color: var(--text-dim); cursor:pointer; font-size:0.75rem;
    display:flex; align-items:center; justify-content:center;
  }
  .event-actions button:hover{ border-color: var(--accent-a); color: var(--accent-a); }
  .event-actions button.danger:hover{ border-color: var(--red); color: var(--red); }

  .modal-overlay{
    position:fixed; inset:0; background: rgba(15,44,71,0.35);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    background: var(--card); border-radius: var(--radius); padding: 22px;
    width:100%; max-width: 400px; box-shadow: 0 20px 60px rgba(15,44,71,0.25);
  }
  .modal h3{ font-family:'Baloo 2'; font-size:1.15rem; margin-bottom:14px; }
  .modal label{ display:block; font-size:0.76rem; font-weight:600; color: var(--text-dim); margin: 12px 0 5px; }
  .modal input, .modal select{
    width:100%; background: var(--bg-alt); border:1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 9px 11px; font-size:0.85rem; font-family:'Inter';
  }
  .modal .row2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
  .modal-actions button{
    border:none; border-radius: 999px; padding: 9px 18px; font-family:'Inter'; font-weight:700;
    font-size:0.85rem; cursor:pointer;
  }
  .btn-cancel{ background: var(--bg-alt); color: var(--text-dim); }
  .btn-save{ background: linear-gradient(100deg, var(--accent-a), var(--accent-b)); color:#fff; }
  .modal-note{ font-size:0.72rem; color: var(--text-faint); margin-top:4px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <span>Hearts2Hearts Calendar<span class="sub"></span></span>
    </div>
    <button class="admin-btn" id="adminBtn"><span class="pip"></span> Admin</button>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="Cari acara">
  </div>
  <div class="view-toggle" id="viewToggle">
    <button data-view="month" class="active">Bulan</button>
    <button data-view="list">Daftar</button>
  </div>
  <button class="add-btn" id="addBtn" style="display:none;">+ Tambah Jadwal</button>
</div>

<div class="filter-row" id="filterRow"></div>

<main>
  <div class="panel" id="mainPanel">
    <div id="monthView">
      <div class="month-nav">
        <h2 id="monthLabel" class="display"></h2>
        <div class="btns">
          <button id="prevMonth">‹</button>
          <button id="nextMonth">›</button>
        </div>
      </div>
      <div class="grid-week">
        <span>M</span><span>S</span><span>S</span><span>R</span><span>K</span><span>J</span><span>S</span>
      </div>
      <div class="grid-days" id="gridDays"></div>
      <div class="day-detail">
        <h3 id="dayDetailLabel">Pilih tanggal untuk lihat detail</h3>
        <div id="dayDetailList"></div>
      </div>
    </div>
    <div id="listView" style="display:none;"></div>
  </div>

  <div class="panel side-panel">
    <h3 class="display">Kategori</h3>
    <div class="legend-item"><i style="background:var(--red)"></i> Siaran / Konten</div>
    <div class="legend-item"><i style="background:var(--gold)"></i> Rilis / Comeback</div>
      <div class="legend-item"><i style="background:var(--blue)"></i> Event</div>
    <div class="legend-item"><i style="background:var(--green)"></i> Member Birthday</div>
    <h3 class="display" style="margin-top:22px;">Segera Datang</h3>
    <div id="upcomingList"></div>
  </div>
</main>

<footer>
  <div>©H2HWave</div>
</footer>

<!-- Modal Form Event -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 class="display" id="modalTitle">Tambah Jadwal</h3>
    <label>Judul acara</label>
    <input type="text" id="fTitle" placeholder="cth. Fan Meeting Jakarta">
    <div class="row2">
      <div>
        <label>Tanggal</label>
        <input type="date" id="fDate">
      </div>
      <div>
        <label>Jam</label>
        <input type="time" id="fTime">
      </div>
    </div>
    <label>Kategori</label>
    <select id="fCat"></select>
    <label>Keterangan</label>
    <input type="text" id="fMeta" placeholder="cth. ICE BSD">
    <div class="modal-note" id="formError" style="color:var(--red); display:none;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">Batal</button>
      <button class="btn-save" id="modalSave">Simpan</button>
    </div>
  </div>
</div>

<!-- Modal Form Login -->
<div class="modal-overlay" id="loginOverlay">
  <div class="modal">
    <h3 class="display">Admin Login</h3>
    <label>Email</label>
    <input type="email" id="lEmail" placeholder="admin@email.com">
    <label>Password</label>
    <input type="password" id="lPass" placeholder="••••••••">
    <div class="modal-note" id="loginError" style="color:var(--red); display:none;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="loginCancel">Batal</button>
      <button class="btn-save" id="loginSubmit">Masuk</button>
    </div>
  </div>
</div>

<script>
// ==========================================
// 1. KONFIGURASI FIREBASE DI SINI
// ==========================================
const firebaseConfig = {
  apiKey: "ISI_API_KEY_KAMU",
  authDomain: "ISI_PROJECT_ID.firebaseapp.com",
  projectId: "ISI_PROJECT_ID",
  storageBucket: "ISI_PROJECT_ID.appspot.com",
  messagingSenderId: "ISI_SENDER_ID",
  appId: "ISI_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
// ==========================================

const CATS = {
  broadcast: { label: 'Siaran', color: 'var(--red)' },
  event:     { label: 'Event', color: 'var(--accent-a)' },
  release:   { label: 'Rilis', color: 'var(--gold)' },
  birthday:  { label: 'Birthday', color: 'var(--green)' },
};

let EVENTS = []; 

function fmtDate(d){
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

let current = new Date();
let activeCats = new Set(Object.keys(CATS));
let searchTerm = '';
let view = 'month';
let selectedDate = fmtDate(new Date());

let isAdmin = false;
let editingIndex = null; 
let editingId = null;

const adminBtn = document.getElementById('adminBtn');
const addBtn = document.getElementById('addBtn');
const loginOverlay = document.getElementById('loginOverlay');
const lEmail = document.getElementById('lEmail');
const lPass = document.getElementById('lPass');
const loginError = document.getElementById('loginError');

// Listener Autentikasi Firebase
auth.onAuthStateChanged((user) => {
  isAdmin = !!user;
  adminBtn.classList.toggle('on', isAdmin);
  adminBtn.innerHTML = isAdmin ? '<span class="pip"></span> Logout' : '<span class="pip"></span> Admin';
  addBtn.style.display = isAdmin ? 'inline-flex' : 'none';
  renderAll();
});

// Tombol Admin ditekan
adminBtn.onclick = () => {
  if(isAdmin){
    auth.signOut();
  } else {
    lEmail.value = '';
    lPass.value = '';
    loginError.style.display = 'none';
    loginOverlay.classList.add('show');
  }
};

document.getElementById('loginCancel').onclick = () => {
  loginOverlay.classList.remove('show');
};

document.getElementById('loginSubmit').onclick = () => {
  const email = lEmail.value.trim();
  const pass = lPass.value;
  if(!email || !pass) return;
  
  auth.signInWithEmailAndPassword(email, pass)
    .then(() => {
      loginOverlay.classList.remove('show');
    })
    .catch((error) => {
      loginError.textContent = 'Kredensial tidak valid.';
      loginError.style.display = 'block';
    });
};

const MONTH_NAMES = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const fTitle = document.getElementById('fTitle');
const fDate = document.getElementById('fDate');
const fTime = document.getElementById('fTime');
const fCat = document.getElementById('fCat');
const fMeta = document.getElementById('fMeta');
const formError = document.getElementById('formError');

function populateCatSelect(){
  fCat.innerHTML = Object.entries(CATS).map(([key,c]) => `<option value="${key}">${c.label}</option>`).join('');
}

function openModal(index = null){
  if(!isAdmin) return;
  editingIndex = index;
  formError.style.display = 'none';
  populateCatSelect();
  if(index === null){
    modalTitle.textContent = 'Tambah Jadwal';
    fTitle.value = '';
    fDate.value = selectedDate || '';
    fTime.value = '';
    fCat.value = Object.keys(CATS)[0];
    fMeta.value = '';
    editingId = null;
  } else {
    const e = EVENTS[index];
    modalTitle.textContent = 'Edit Jadwal';
    fTitle.value = e.title;
    fDate.value = e.date;
    fTime.value = e.time === '-' ? '' : e.time;
    fCat.value = e.cat;
    fMeta.value = e.meta;
    editingId = e.id;
  }
  modalOverlay.classList.add('show');
}

function closeModal(){
  modalOverlay.classList.remove('show');
  editingIndex = null;
  editingId = null;
}

document.getElementById('addBtn').onclick = () => openModal(null);
document.getElementById('modalCancel').onclick = closeModal;
modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });

document.getElementById('modalSave').onclick = () => {
  if(!isAdmin) return;
  if(!fTitle.value.trim() || !fDate.value){
    formError.textContent = 'Judul dan tanggal wajib diisi.';
    formError.style.display = 'block';
    return;
  }
  const data = {
    date: fDate.value,
    time: fTime.value || '-',
    cat: fCat.value,
    title: fTitle.value.trim(),
    meta: fMeta.value.trim(),
  };
  
  if(editingId === null){
    db.collection("events").add(data);
  } else {
    db.collection("events").doc(editingId).update(data);
  }
  closeModal();
};

function deleteEvent(index){
  if(!isAdmin) return;
  if(!confirm('Hapus jadwal ini?')) return;
  const id = EVENTS[index].id;
  db.collection("events").doc(id).delete();
}

const filterRow = document.getElementById('filterRow');
function renderChips(){
  filterRow.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (activeCats.size === Object.keys(CATS).length ? ' active' : '');
  allChip.innerHTML = `<span class="dot" style="background:linear-gradient(100deg,var(--accent-a),var(--accent-b))"></span> Semua`;
  allChip.onclick = () => { activeCats = new Set(Object.keys(CATS)); renderChips(); renderAll(); };
  filterRow.appendChild(allChip);

  Object.entries(CATS).forEach(([key, c]) => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeCats.has(key) ? ' active' : '');
    chip.style.setProperty('--dotcolor', c.color);
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span> ${c.label}`;
    chip.onclick = () => {
      if(activeCats.has(key) && activeCats.size === 1){ activeCats = new Set(Object.keys(CATS)); }
      else if(activeCats.size === Object.keys(CATS).length){ activeCats = new Set([key]); }
      else if(activeCats.has(key)){ activeCats.delete(key); }
      else{ activeCats.add(key); }
      renderChips(); renderAll();
    };
    filterRow.appendChild(chip);
  });
}

function filteredEvents(){
  const todayStr = fmtDate(new Date());
  return EVENTS.filter(e => {
    if(e.date < todayStr && e.cat !== 'birthday') return false;
    return activeCats.has(e.cat) &&
    (searchTerm === '' || e.title.toLowerCase().includes(searchTerm) || e.meta.toLowerCase().includes(searchTerm));
  });
}
function eventsOn(dateStr){
  return filteredEvents().filter(e => e.date === dateStr);
}

const gridDays = document.getElementById('gridDays');
const monthLabel = document.getElementById('monthLabel');

function renderMonth(){
  monthLabel.textContent = `${MONTH_NAMES[current.getMonth()]} ${current.getFullYear()}`;
  gridDays.innerHTML = '';
  const year = current.getFullYear(), month = current.getMonth();
  const firstDay = new Date(year, month, 1);
  let startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const todayStr = fmtDate(new Date());

  const cells = [];
  for(let i=startOffset; i>0; i--){
    cells.push({ day: daysInPrevMonth - i + 1, other:true, date: new Date(year, month-1, daysInPrevMonth - i + 1) });
  }
  for(let d=1; d<=daysInMonth; d++){
    cells.push({ day:d, other:false, date: new Date(year, month, d) });
  }
  while(cells.length % 7 !== 0){
    const d = cells.length - (startOffset + daysInMonth) + 1;
    cells.push({ day:d, other:true, date: new Date(year, month+1, d) });
  }

  cells.forEach(c => {
    const dateStr = fmtDate(c.date);
    const dayEvents = eventsOn(dateStr);
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (c.other ? ' other':'') + (dateStr===todayStr?' today':'') + (dateStr===selectedDate?' selected':'');
    cell.innerHTML = `<span class="day-num">${c.day}</span>
      <div class="day-dots">${dayEvents.slice(0,4).map(e=>`<i style="background:${CATS[e.cat].color}"></i>`).join('')}</div>`;
    cell.onclick = () => { selectedDate = dateStr; renderMonth(); renderDayDetail(); };
    gridDays.appendChild(cell);
  });
}

function renderDayDetail(){
  const label = document.getElementById('dayDetailLabel');
  const list = document.getElementById('dayDetailList');
  if(!selectedDate){ label.textContent = 'Pilih tanggal untuk lihat detail'; list.innerHTML=''; return; }
  const dateParts = selectedDate.split('-');
  const d = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
  label.textContent = d.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const evs = eventsOn(selectedDate);
  list.innerHTML = evs.length ? evs.map(eventCardHTML).join('') : '<div class="empty-msg">Tidak ada acara pada tanggal ini.</div>';
}

function eventCardHTML(e){
  const c = CATS[e.cat];
  const idx = EVENTS.indexOf(e);
  const adminActions = isAdmin ? `
    <div class="event-actions">
      <button onclick="openModal(${idx})" title="Edit">✎</button>
      <button class="danger" onclick="deleteEvent(${idx})" title="Hapus">✕</button>
    </div>` : '';
  return `<div class="event">
    <div class="bar" style="background:${c.color}"></div>
    <div class="body">
      <div class="time">${e.time}</div>
      <div class="title">${e.title}</div>
      <div class="meta">${e.meta}</div>
      <span class="tag" style="background:${c.color}22; color:${c.color}">${c.label}</span>
    </div>
    ${adminActions}
  </div>`;
}

function renderList(){
  const container = document.getElementById('listView');
  const evs = filteredEvents().slice().sort((a,b)=> a.date.localeCompare(b.date));
  const groups = {};
  evs.forEach(e=>{
    const dateParts = e.date.split('-');
    const key = `${MONTH_NAMES[parseInt(dateParts[1])-1]} ${dateParts[0]}`;
    groups[key] = groups[key] || [];
    groups[key].push(e);
  });
  if(Object.keys(groups).length === 0){
    container.innerHTML = '<div class="empty-msg">Tidak ada acara yang cocok.</div>';
    return;
  }
  container.innerHTML = Object.entries(groups).map(([month, list]) => `
    <div class="list-group">
      <h3 class="display">${month}</h3>
      ${list.map(e => {
        const dParts = e.date.split('-');
        return `<div style="display:flex; gap:10px; align-items:flex-start;">
        <div style="width:52px; flex-shrink:0; font-size:0.72rem; color:var(--text-faint); padding-top:14px;">
          ${dParts[2]} ${MONTH_NAMES[parseInt(dParts[1])-1].slice(0,3)}
        </div>
        ${eventCardHTML(e)}
      </div>`;
      }).join('')}
    </div>
  `).join('');
}

function renderUpcoming(){
  const el = document.getElementById('upcomingList');
  const todayStr = fmtDate(new Date());
  const evs = filteredEvents().filter(e=>e.date >= todayStr).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
  el.innerHTML = evs.length ? evs.map(e => {
    const dParts = e.date.split('-');
    return `
    <div style="margin-bottom:12px;">
      <div style="font-size:0.72rem; color:var(--text-faint); font-weight:600;">${dParts[2]} ${MONTH_NAMES[parseInt(dParts[1])-1].slice(0,3)}</div>
      <div style="font-size:0.85rem; font-weight:600; margin-top:2px;">${e.title}</div>
    </div>
  `}).join('') : '<div class="empty-msg">Tidak ada.</div>';
}

document.getElementById('viewToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  view = btn.dataset.view;
  document.querySelectorAll('.view-toggle button').forEach(b=>b.classList.toggle('active', b===btn));
  document.getElementById('monthView').style.display = view==='month' ? '' : 'none';
  document.getElementById('listView').style.display = view==='list' ? '' : 'none';
  renderAll();
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value.toLowerCase().trim();
  renderAll();
});

document.getElementById('prevMonth').onclick = () => { current = new Date(current.getFullYear(), current.getMonth()-1, 1); renderMonth(); };
document.getElementById('nextMonth').onclick = () => { current = new Date(current.getFullYear(), current.getMonth()+1, 1); renderMonth(); };

function renderAll(){
  if(view==='month'){ renderMonth(); renderDayDetail(); }
  else{ renderList(); }
  renderUpcoming();
}

db.collection("events").onSnapshot((querySnapshot) => {
  EVENTS = [];
  querySnapshot.forEach((doc) => {
    EVENTS.push({ id: doc.id, ...doc.data() });
  });
  renderChips();
  renderAll();
});
</script>
</body>
</html>
