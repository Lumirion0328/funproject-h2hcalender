<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearts2Hearts Calendar</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=18">
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-auth-compat.js"></script>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <span>Hearts2Hearts Calendar<span class="sub"></span></span>
    </div>
    <div class="header-actions">
      <button class="add-btn" id="addBtn" style="display:none;"><span class="add-btn-icon">+</span><span class="add-btn-text">Tambah Jadwal</span></button>
      <button class="admin-btn" id="adminBtn"><span class="pip"></span> Admin</button>
    </div>
  </div>
</header>

<div class="controls">
  <div class="controls-left">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Cari acara">
    </div>
  </div>
</div>

<div class="filter-row">
  <div class="filter-row-left">
    <div class="filter-row-chips" id="filterRow"></div>
    <div class="filter-row-actions">
      <div class="view-toggle" id="viewToggle">
        <button data-view="month" class="active">Bulan</button>
        <button data-view="list">Daftar</button>
      </div>
      <button class="refresh-btn" id="refreshBtn" title="Refresh jadwal">↻</button>
    </div>
  </div>
</div>

<main>
  <div class="panel" id="mainPanel">
    <div id="monthView">
      <div class="month-nav">
        <h2 id="monthLabel" class="display"></h2>
        <div class="btns">
          <button id="prevMonth">‹</button>
          <button id="nextMonth">›</button>
        </div>
      </div>
      <div class="grid-week">
        <span>M</span><span>S</span><span>S</span><span>R</span><span>K</span><span>J</span><span>S</span>
      </div>
      <div class="grid-days" id="gridDays"></div>
    </div>
    <div id="listView" style="display:none;"></div>
  </div>

  <div class="panel side-panel">
    <h3 class="display">Kategori</h3>
    <div class="legend-item"><i style="background:var(--red)"></i> Siaran / Konten</div>
    <div class="legend-item"><i style="background:var(--gold)"></i> Rilis / Comeback</div>
      <div class="legend-item"><i style="background:var(--blue)"></i> Event</div>
    <div class="legend-item"><i style="background:var(--green)"></i> Member Birthday</div>
    <h3 class="display" style="margin-top:22px;">Segera Datang</h3>
    <div id="upcomingList"></div>
  </div>
</main>

<footer>
  <a href="https://x.com/H2H_Wave" target="_blank" rel="noopener noreferrer">@H2H_Wave</a>
</footer>

<!-- Modal Form Event -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 class="display" id="modalTitle">Tambah Jadwal</h3>
    <label>Judul acara</label>
    <input type="text" id="fTitle" placeholder="cth. Fan Meeting Jakarta">
    <div class="row2">
      <div>
        <label>Tanggal</label>
        <input type="date" id="fDate">
      </div>
      <div>
        <label>Jam</label>
        <input type="time" id="fTime">
      </div>
    </div>
    <label>Kategori</label>
    <select id="fCat"></select>
    <label>Keterangan</label>
    <input type="text" id="fMeta" placeholder="cth. ICE BSD">
    <label>Sumber (link, opsional)</label>
    <input type="url" id="fSource" placeholder="https://x.com/... atau link berita">
    <div class="modal-note" id="formError" style="color:var(--red); display:none;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">Batal</button>
      <button class="btn-save" id="modalSave">Simpan</button>
    </div>
  </div>
</div>

<!-- Modal Detail Acara -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal detail-modal">
    <div class="detail-modal-top">
      <span class="detail-brand">HEARTS2HEARTS</span>
      <div class="detail-modal-icons">
        <button id="detailClose" title="Tutup">✕</button>
      </div>
    </div>
    <h3 class="display detail-modal-title" id="detailTitle"></h3>
    <div class="detail-row">
      <span class="detail-label">Tanggal</span>
      <span class="detail-value" id="detailDate"></span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Jam</span>
      <span class="detail-value" id="detailTime"></span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Kategori</span>
      <span class="detail-value" id="detailCat"></span>
    </div>
    <div class="detail-row" id="detailMetaRow">
      <span class="detail-label">Keterangan</span>
      <span class="detail-value" id="detailMeta"></span>
    </div>
    <div class="detail-row" id="detailSourceRow">
      <span class="detail-label">Sumber</span>
      <span class="detail-value"><a id="detailSourceLink" target="_blank" rel="noopener noreferrer">Buka sumber ↗</a></span>
    </div>
    <div id="detailEmbed" class="detail-embed" style="display:none;"></div>
  </div>
</div>

<!-- Modal Form Login -->
<div class="modal-overlay" id="loginOverlay">
  <div class="modal">
    <h3 class="display">Admin Login</h3>
    <form id="loginForm" autocomplete="on" method="post" action="javascript:void(0);" onsubmit="return false;">
      <label>Email</label>
      <input type="email" id="lEmail" name="email" placeholder="admin@email.com" autocomplete="username">
      <label>Password</label>
      <input type="password" id="lPass" name="password" placeholder="••••••••" autocomplete="current-password">
      <div class="modal-note" id="loginError" style="color:var(--red); display:none;"></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="loginCancel">Batal</button>
        <button type="submit" class="btn-save" id="loginSubmit">Masuk</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js?v=14"></script>
</body>
</html>
